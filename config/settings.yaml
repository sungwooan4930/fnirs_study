device:
  # 하드웨어 담당자와 확정 필요
  # 확정: wavelengths_nm, n_channels (2026-04-07)
  # 미확정: sampling_rate_hz, sds_mm, source_detector_pairs
  wavelengths_nm: [780, 850, 950]  # 확정: 3파장 (nm)
  sampling_rate_hz: 10.0           # placeholder — 하드웨어 확정 필요
  n_channels: 4                    # 확정: 4채널
  sds_mm: 30.0                     # placeholder — 하드웨어 확정 필요
  source_detector_pairs:           # placeholder — 하드웨어 확정 필요
    - [1, 1]
    - [1, 2]
    - [2, 1]
    - [2, 2]

processing:
  bandpass_low_hz: 0.01
  bandpass_high_hz: 0.5
  baseline_window_sec: 5.0
  # 몰흡광계수 (L/(mmol·cm)) — 780nm, 850nm, 950nm
  # placeholder: 파장 확정에 맞게 조정 필요 (Prahl 표 기준 근사값)
  extinction_coefficients:
    hbo: [0.975, 0.901, 1.046]   # HbO2: 780nm, 850nm, 950nm
    hbr: [2.755, 0.781, 0.260]   # HbR: 780nm, 850nm, 950nm
  dpf: [6.51, 5.86, 5.12]        # placeholder: 파장별 차분 경로 인수

storage:
  data_dir: "data"
  session_filename_format: "%Y%m%d_%H%M%S_session.h5"

simulator:
  hbo_amplitude: 0.5               # μmol/L
  hbo_freq_hz: 0.1                 # 집중도 변화 주파수
  noise_std: 0.05                  # 노이즈 표준편차
