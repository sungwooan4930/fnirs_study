# T2·T3 전용. 드리프트가 켜져 있고 세션이 3회다.
# 개발 속도를 위해 EEG는 250 Hz, 피험자 8명으로 줄였다 — 검증 대상은
# 절대 성능이 아니라 정규화 전후의 차이이므로 규모가 작아도 성립한다.
run_name: session_recovery
seed: 42

simulation:
  n_subjects: 8
  n_sessions: 3
  subject_variance: 0.5
  effect_size: 0.8
  lead_delta_s: 1.2
  task:
    nback_levels: [0, 2, 3]
    block_duration_s: 30
    baseline_duration_s: 20
    n_blocks_per_level: 2
    stim_interval_s: 2.0
  practice:
    rate: 0.15
  drift:
    # T2(붕괴) 검증 과정에서 브리프 원안 시그마(0.20/0.10/0.15/0.15)로는
    # cross_session 정규화-off 정확도가 chance로 무너지지 않았다 (pooled
    # 0.5532, 진짜 인지 효과가 드리프트를 압도). assignment: sampled에서는
    # between_big이 항상 False로 고정돼 between_session_scale(4.0)이 아예
    # 적용되지 않으므로, 실제로 드리프트 강도를 올리는 손잡이는 아래 4개
    # sigma뿐이다. fnirs_gain·offset·eeg_gain을 8배로 올리고(잡음 성분인
    # eeg_noise_sigma는 그대로 둔다 — 정규화로 고칠 수 없는 무작위 잡음을
    # 늘리는 것은 "드리프트를 강화"가 아니다) off를 chance 근처로 무너뜨렸다.
    # 근거는 task-14-report.md 참조.
    fnirs_gain_sigma: 1.60
    fnirs_offset_sigma: 0.80
    eeg_gain_sigma: 1.20
    eeg_noise_sigma: 0.15
    within_session_rate: 0.30
    within_session_fraction: 0.33
    between_session_scale: 4.0
    assignment: sampled
  eeg:   {n_channels: 30, sfreq_hz: 250}
  fnirs: {n_channels: 48, sfreq_hz: 10.4, hbr_coupling: -0.33}

windowing:
  window_s: 5.0
  step_s: 1.0

features:
  extractor: minimal

preprocessing:
  baseline:
    normalize: true
    drift_threshold_relative: 0.20
    zero_atol: 1.0e-8

dataset:
  targets: [cognitive_load]
  lead_targets: [accuracy, response_latency]
  modalities: [eeg, fnirs, behavior]
  rt_bins: [0.5, 0.8]
  include_baseline: false

evaluation:
  splitter: cross_session
  model: logistic_regression
  guards:
    check_subject_overlap: true
    check_window_overlap: true
    check_session_overlap: true
    check_normalization_source: true

output:
  results_dir: results
