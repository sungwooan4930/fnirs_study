# T4 전용 음성 대조군. session_recovery.yaml을 복사하고 드리프트를 전부
# 끈다 — b_ref(연습 효과만 남은 깨끗한 기울기)의 기준 실행이다.
# seed는 42로 그대로 둔다: 난수열 규율(스펙 §5.5) 덕분에 드리프트를 꺼도
# 같은 난수열 위에서 돌므로 이 실행이 b_hat(session_recovery.yaml, on)의
# 정당한 기준이 된다.
run_name: session_clean
seed: 42

simulation:
  n_subjects: 8
  n_sessions: 3
  subject_variance: 0.5
  effect_size: 0.8
  lead_delta_s: 1.2
  task:
    nback_levels: [0, 2, 3]
    block_duration_s: 30
    baseline_duration_s: 20
    n_blocks_per_level: 2
    stim_interval_s: 2.0
  practice:
    rate: 0.15
  drift:
    fnirs_gain_sigma: 0.0
    fnirs_offset_sigma: 0.0
    eeg_gain_sigma: 0.0
    eeg_noise_sigma: 0.0
    within_session_rate: 0.0
    within_session_fraction: 0.33
    between_session_scale: 4.0
    assignment: sampled
  eeg:   {n_channels: 30, sfreq_hz: 250}
  fnirs: {n_channels: 48, sfreq_hz: 10.4, hbr_coupling: -0.33}

windowing:
  window_s: 5.0
  step_s: 1.0

features:
  extractor: minimal

preprocessing:
  baseline:
    normalize: false
    drift_threshold_relative: 0.20
    zero_atol: 1.0e-8

dataset:
  targets: [cognitive_load]
  lead_targets: [accuracy, response_latency]
  modalities: [eeg, fnirs, behavior]
  rt_bins: [0.5, 0.8]
  include_baseline: false

evaluation:
  splitter: cross_session
  model: logistic_regression
  guards:
    check_subject_overlap: true
    check_window_overlap: true
    check_session_overlap: true
    check_normalization_source: true

output:
  results_dir: results
