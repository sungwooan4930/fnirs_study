# T4 전용 음성 대조군. session_recovery.yaml을 복사하고 드리프트를 전부
# 끈다 — b_ref(연습 효과만 남은 깨끗한 기울기)의 기준 실행이다.
# seed는 42로 그대로 둔다: 난수열 규율(스펙 §5.5) 덕분에 드리프트를 꺼도
# 같은 난수열 위에서 돌므로 이 실행이 b_hat(session_recovery.yaml, on)의
# 정당한 기준이 된다.
#
# preprocessing.baseline.normalize는 true다. tests/evaluation/
# test_validation_session.py의 `_practice_slope`는 이 값을 읽지 않고
# 호출자(T4 헬퍼)가 `normalize=True/False`를 파이썬 인자로 명시적으로
# 넘긴다 — 그러나 config 자신의 선언값이 실제 쓰임(둘 다 정규화 on, §8.4.1
# "정정 3" 참조)과 어긋나면 다음 사람이 "이 config는 정규화 off 기준"이라고
# 오독한다(2026-08-19 리뷰 Important 2). 그래서 true로 맞춘다 — 이 config를
# `run_experiment`로 직접 돌려도 T4가 실제로 비교하는 파이프라인(드리프트
# off·정규화 on)과 같은 동작을 하도록.
run_name: session_clean
seed: 42

simulation:
  n_subjects: 8
  n_sessions: 3
  subject_variance: 0.5
  effect_size: 0.8
  lead_delta_s: 1.2
  task:
    nback_levels: [0, 2, 3]
    block_duration_s: 30
    baseline_duration_s: 20
    n_blocks_per_level: 2
    stim_interval_s: 2.0
  practice:
    rate: 0.15
  drift:
    fnirs_gain_sigma: 0.0
    fnirs_offset_sigma: 0.0
    eeg_gain_sigma: 0.0
    eeg_noise_sigma: 0.0
    within_session_rate: 0.0
    within_session_fraction: 0.33
    between_session_scale: 4.0
    assignment: sampled
  eeg:   {n_channels: 30, sfreq_hz: 250}
  fnirs: {n_channels: 48, sfreq_hz: 10.4, hbr_coupling: -0.33}

windowing:
  window_s: 5.0
  step_s: 1.0

features:
  extractor: minimal

preprocessing:
  baseline:
    normalize: true
    drift_threshold_relative: 2.15
    zero_atol: 1.0e-8

dataset:
  targets: [cognitive_load]
  lead_targets: [accuracy, response_latency]
  modalities: [eeg, fnirs, behavior]
  rt_bins: [0.5, 0.8]
  include_baseline: false

evaluation:
  splitter: cross_session
  model: logistic_regression
  guards:
    check_subject_overlap: true
    check_window_overlap: true
    check_session_overlap: true
    check_normalization_source: true

output:
  results_dir: results
