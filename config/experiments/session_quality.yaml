# T5·T6 전용. T6은 2×2 배치(assignment: fixed_2x2)로 세션 간(①②)·세션
# 내(③) 드리프트를 독립으로 켜고 끄기 위해 세션 4개가 필요하다.
# session_recovery.yaml(T2·T3용, assignment: sampled)을 베이스로 하되
# n_subjects·n_sessions·drift·task.baseline_duration_s 블록만 바꿨다.
# n_subjects: 4 -> 8 (2026-08-19). 되돌릴 이유가 없다 — 표본이 많을수록
# T6의 완전 분리 요구(네 칸 전원 일치)가 더 엄격한 시험이 된다.
# task.baseline_duration_s: 20 -> 60 (2026-08-19, 리뷰가 발견 + 컨트롤러
# 3차 판정). 20초는 5초창·1초스텝에서 베이스라인 창을 약 16개만 준다 —
# compute_drift의 분모(std(ddof=1), Task 16 §6.3 수정)가 그 정도 창
# 수에서는 불안정해 48채널 fnirs가 잡음을 그대로 받는다(세 시드 재현:
# 20초에서는 세션0·2의 오탐 비율이 0.125~0.500으로 시드마다 흔들림).
# 60초(창 ~56개)로 늘리면 세 시드(42·7·2026) 전부 완전 분리로 돌아온다.
# task-16-report.md·spec §8.4.1 "정정 8" 참조.
run_name: session_quality
seed: 42

simulation:
  n_subjects: 8
  n_sessions: 4
  subject_variance: 0.5
  effect_size: 0.8
  lead_delta_s: 1.2
  task:
    nback_levels: [0, 2, 3]
    block_duration_s: 30
    baseline_duration_s: 60
    n_blocks_per_level: 2
    stim_interval_s: 2.0
  practice:
    rate: 0.15
  drift:
    fnirs_gain_sigma: 0.20
    fnirs_offset_sigma: 0.10
    eeg_gain_sigma: 0.15
    eeg_noise_sigma: 0.15
    within_session_rate: 0.30
    within_session_fraction: 0.33
    between_session_scale: 4.0
    assignment: fixed_2x2
  eeg:   {n_channels: 30, sfreq_hz: 250}
  fnirs: {n_channels: 48, sfreq_hz: 10.4, hbr_coupling: -0.33}

windowing:
  window_s: 5.0
  step_s: 1.0

features:
  extractor: minimal

preprocessing:
  baseline:
    normalize: true
    # 2026-08-19 재보정 (Task 16). compute_drift 분모를 |mean(start)|에서
    # std(start, ddof=1)로 고치면서 단위가 "베이스라인 평균 대비 상대 비율"
    # 에서 "베이스라인 표준편차 배수"로 바뀌어 0.20은 더 이상 맞는 자리가
    # 아니었다. 2.15는 project-wide 값이다(컨트롤러 지시로 smoke·null·
    # pilot·session_recovery·session_clean·session_quality 전부 동일하게
    # 맞춤 — 지표가 스케일 자유이므로 config별로 다를 이유가 없다). 유도:
    # eeg 작은 군 최댓값·큰 군 최솟값의 중간값 ≈ 2.15.
    # baseline_duration_s=60·n_subjects=8로 T6(완전 분리 판정)을 재확인한
    # 결과(세 시드 42·7·2026 전부): 세션0·2(핵심 칸)는 8명 전원 비플래그,
    # 세션1·3은 8명 전원 플래그 — eeg·fnirs 둘 다 분리에 기여한다.
    # task-16-report.md·spec §8.4.1 "정정 8" 참조.
    drift_threshold_relative: 2.15
    zero_atol: 1.0e-8

dataset:
  targets: [cognitive_load]
  lead_targets: [accuracy, response_latency]
  modalities: [eeg, fnirs, behavior]
  rt_bins: [0.5, 0.8]
  include_baseline: false

evaluation:
  splitter: cross_session
  model: logistic_regression
  guards:
    check_subject_overlap: true
    check_window_overlap: true
    check_session_overlap: true
    check_normalization_source: true

output:
  results_dir: results
