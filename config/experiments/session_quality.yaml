# T5·T6 전용. T6은 2×2 배치(assignment: fixed_2x2)로 세션 간(①②)·세션
# 내(③) 드리프트를 독립으로 켜고 끄기 위해 세션 4개가 필요하다.
# session_recovery.yaml(T2·T3용, assignment: sampled)을 베이스로 하되
# n_subjects·n_sessions·drift 블록만 바꿨다.
# n_subjects: 4 -> 8 (2026-08-19, 컨트롤러 지시). T6 판정을 "개별 녹화 완전
# 분리"에서 "칸별 플래그 비율"로 바꾼 뒤(테스트 파일 참조) n=4에서는 비율이
# 0/0.25/0.5/0.75/1.0 다섯 값만 가능해 추정이 거칠었다. 8이면 더 세분된다.
run_name: session_quality
seed: 42

simulation:
  n_subjects: 8
  n_sessions: 4
  subject_variance: 0.5
  effect_size: 0.8
  lead_delta_s: 1.2
  task:
    nback_levels: [0, 2, 3]
    block_duration_s: 30
    baseline_duration_s: 20
    n_blocks_per_level: 2
    stim_interval_s: 2.0
  practice:
    rate: 0.15
  drift:
    fnirs_gain_sigma: 0.20
    fnirs_offset_sigma: 0.10
    eeg_gain_sigma: 0.15
    eeg_noise_sigma: 0.15
    within_session_rate: 0.30
    within_session_fraction: 0.33
    between_session_scale: 4.0
    assignment: fixed_2x2
  eeg:   {n_channels: 30, sfreq_hz: 250}
  fnirs: {n_channels: 48, sfreq_hz: 10.4, hbr_coupling: -0.33}

windowing:
  window_s: 5.0
  step_s: 1.0

features:
  extractor: minimal

preprocessing:
  baseline:
    normalize: true
    # 2026-08-19 재보정 (Task 16). compute_drift 분모를 |mean(start)|에서
    # std(start, ddof=1)로 고치면서 단위가 "베이스라인 평균 대비 상대 비율"
    # 에서 "베이스라인 표준편차 배수"로 바뀌어 0.20은 더 이상 맞는 자리가
    # 아니었다. 2.15는 project-wide 값이다(컨트롤러 지시로 smoke·null·
    # pilot·session_recovery·session_clean·session_quality 전부 동일하게
    # 맞춤 — 지표가 스케일 자유이므로 config별로 다를 이유가 없다). 유도:
    # 4피험자×4세션 실측에서 eeg 작은 군 최댓값 0.788948·큰 군 최솟값
    # 3.515019의 중간값 (0.788948+3.515019)/2 = 2.151984 ≈ 2.15.
    # 8피험자로 늘린 뒤 T6(비율 판정)을 이 임계로 재확인한 결과: 세션
    # 0=0.250·1=1.000·2(핵심 칸)=0.125·3=1.000 — 전부 T6_NEGATIVE_FLAG_
    # RATE_MAX(0.25)·T6_POSITIVE_FLAG_RATE_MIN(0.75) 안. task-16-report.md
    # 참조.
    drift_threshold_relative: 2.15
    zero_atol: 1.0e-8

dataset:
  targets: [cognitive_load]
  lead_targets: [accuracy, response_latency]
  modalities: [eeg, fnirs, behavior]
  rt_bins: [0.5, 0.8]
  include_baseline: false

evaluation:
  splitter: cross_session
  model: logistic_regression
  guards:
    check_subject_overlap: true
    check_window_overlap: true
    check_session_overlap: true
    check_normalization_source: true

output:
  results_dir: results
